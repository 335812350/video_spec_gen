<script>
const captions = [{"start":0,"duration":9,"text":"谁也没想到，一个在标准件厂干了二十年钳工的人，会因为一张填错的表格，突然被调进集团总部。"},{"start":9,"duration":12,"text":"更没人想到的是，等所有人终于发现调令搞错时，这个错误已经不再只是一个人的去留，而变成了一场谁都不敢承认的集体误会。"},{"start":21,"duration":10,"text":"这个人叫胡建林。对工厂来说，他是最熟悉机器和零件的老员工；对总部来说，他却像一个从天而降的神秘人物。"},{"start":31,"duration":8,"text":"而电影最荒唐的地方在于，胡建林本人一直以为，这是自己努力了二十年，终于等来的机会。"},{"start":39,"duration":3,"text":"事情要从庄正直说起。"},{"start":42,"duration":13,"text":"庄正直是标准件厂的供销科科长。他不甘心一直待在基层，于是拿出夫妻俩省吃俭用、原本给孩子交择校费的三十万元，托关系运作调去总公司。"},{"start":55,"duration":10,"text":"他以为只要钱送到，位置就会按计划出现。可关系网里的每个人，都只把这件事当成一笔可以继续往后推的生意。"},{"start":65,"duration":13,"text":"庄正直一边等调令，一边继续做着见不得光的换货生意。一次争执后，他把同伙锁进冷藏车，自己还沉浸在“调动马上就要成功”的幻想里。"},{"start":78,"duration":12,"text":"另一边，托马斯把标准件厂的调动任务交给了皮特。皮特正在泳池派对里玩得兴起，接到电话时，连上个月要办的究竟是什么都想不起来。"},{"start":90,"duration":15,"text":"他回到办公室，翻到胡建林报名参加年会的材料，酒意和流程在这一刻撞到了一起。报名表被看成调职申请，胡建林的名字被输入系统，错误就这样被正式盖章。"},{"start":105,"duration":7,"text":"没有人认真确认，也没有人愿意停下来问一句：调走的，真的是这个人吗？"},{"start":112,"duration":10,"text":"所以，庄正直花钱买来的位置没有落到自己头上，胡建林却在毫不知情的情况下，拿到了一张通往总部的调令。"},{"start":122,"duration":5,"text":"胡建林收拾行李，告别师娘，带着工友们的祝福去了省城。"},{"start":127,"duration":14,"text":"在他看来，自己终于被集团看见了。总部给出的待遇更让他相信，这不是普通调动，而是一场迟到的奖励：四十万元年薪、体面的办公室和全新的身份。"},{"start":141,"duration":13,"text":"马杰负责接待他。为了让这个钳工看起来像总部新员工，马杰给他取了一个英文名“庄尼”，带他参观办公区，还把他安置进集团的免费样板间。"},{"start":154,"duration":11,"text":"胡建林不懂总部的流程，却认真地问每一个问题。他问自己为什么被调来，问年会节目怎么报名，也问同事们叫什么名字。"},{"start":165,"duration":6,"text":"这些在工厂里再正常不过的动作，到了总部却开始被重新解释。"},{"start":171,"duration":15,"text":"真正知道错误的人只有马杰。马杰很快发现，集团要找的根本不是胡建林。可他没有立刻说出真相，因为在这家公司，纠正一次错误，可能意味着承认自己也参与了错误。"},{"start":186,"duration":13,"text":"于是马杰决定先把裂缝缝起来：不让胡建林接触关键工作，不让别人知道调令出了问题，再用一套新的说法把他包装成“集团安排的人”。"},{"start":199,"duration":10,"text":"从这一刻开始，胡建林不再只是胡建林。他被叫作庄尼，被猜成董事长的人，也被当成某个更高层级的信号。"},{"start":209,"duration":6,"text":"一个人的真实来处被藏起来以后，周围的人就只能用猜测替他补上身份。"},{"start":215,"duration":11,"text":"集团此时正在推进“广进计划”。名字听起来像业务增长，内容却是裁掉百分之四十的人员，也就是六千个普通员工。"},{"start":226,"duration":9,"text":"裁员消息泄露后，员工们开始互相猜测：谁会留下，谁会被优化，谁又会成为那个替别人背锅的人。"},{"start":235,"duration":13,"text":"胡建林偏偏在这个时候接下了和员工沟通的任务。他不会说“组织结构调整”，只会问对方家里几口人、平时负责什么工作、为什么想留下。"},{"start":248,"duration":14,"text":"他记住了一个又一个名字，也因此被所有人误会成掌握生杀大权的人。员工看到他出现，第一反应不是打招呼，而是赶紧猜自己是不是已经被列进名单。"},{"start":262,"duration":14,"text":"更荒唐的是，胡建林把“优化”理解成把工作做得更好。他发现有人被不公平对待，就试着给员工涨薪、改善条件，却因此触碰了集团最不想面对的矛盾。"},{"start":276,"duration":16,"text":"管理层认为他越权，员工却把他当成真正愿意听人说话的领导。最后，这个本来什么都不懂的人，反而因为一次次误会得到升职，年薪涨到七十二万元，还被安排去给高管培训。"},{"start":292,"duration":13,"text":"胡建林带着一群西装革履的管理者回到车间，教他们怎么做一把锤子。机器声、汗水和真实的劳动，把总部会议里的漂亮话重新压回了具体的重量。"},{"start":305,"duration":13,"text":"董事长来到现场，看见胡建林和工人们相处的样子。胡建林不知道自己已经被推到多高的位置，他只知道零件要合格，工友不能被随便丢下。"},{"start":318,"duration":12,"text":"这个笑话真正刺人的地方是：胡建林没有突然变得更有能力，改变的只是别人看他的方式。位置先被抬高，行为才被解释成能力。"},{"start":330,"duration":9,"text":"胡建林和马杰、潘怡然逐渐成了朋友。潘怡然是外包员工，做着同样的工作，却始终隔着一道身份的门。"},{"start":339,"duration":18,"text":"三个人在江边喝酒时，胡建林还在努力理解总部的规则。可庄正直已经从托总口中知道，自己花钱运作的调职被搞错了。更糟的是，胡建林的错调只是表面，标准件厂的问题才是集团真正想处理的对象。"},{"start":357,"duration":13,"text":"集团会议上，高管们讨论如何用“优化”解决现金流危机。标准件厂被摆上桌面，关闭工厂、裁掉工人，看起来只是一行可以提交的方案。"},{"start":370,"duration":13,"text":"胡建林被一套听起来合理的说法哄着签下文件。直到他在新闻里看到老厂即将关闭，才意识到自己签下的不是普通流程，而是把工友推向失业的决定。"},{"start":383,"duration":13,"text":"他回到工厂，发现原本应该合格的零件存在问题；再顺着货物、发票和供应商的线索查下去，假零件、换货和行贿渐渐连成了一条线。"},{"start":396,"duration":16,"text":"马杰终于把真相告诉胡建林：当初那张调令就是错的。胡建林没有立刻责怪他，因为他已经看见，真正的问题不是某个人手滑了一次，而是一整套系统让所有人都选择继续装作没看见。"},{"start":412,"duration":13,"text":"三个人站在天台上争论。马杰害怕失去工作，潘怡然不愿再替别人承担代价，胡建林则第一次明确地说，他不能眼看着老厂被这样关掉。"},{"start":425,"duration":10,"text":"他们决定把证据带到集团年会。因为那里是所有人最愿意展示光鲜的一面，也可能是最难继续藏住真相的地方。"},{"start":435,"duration":10,"text":"徐云峰试图收买胡建林，庄正直则为了自保揭出更多内幕。三个人带着证据被人围堵、殴打，仍然没有放弃。"},{"start":445,"duration":14,"text":"胡建林回到工厂，劝工友们一起去年会。他没有承诺自己能改变什么，只是告诉大家：如果所有人都继续沉默，那么明天被写进名单的，可能就是下一个人。"},{"start":459,"duration":13,"text":"年会开始时，台上依旧是灯光、掌声和精心排练的节目。胡建林一行人却在夜色里赶路、迷路，像一群不熟悉舞台规则的人，硬要把真实带进去。"},{"start":472,"duration":14,"text":"他们终于赶到现场。先是节目混乱，接着胡建林站上台唱起《我的未来不是梦》，马杰和潘怡然也加入进来，把加班、裁员、五险一金和外包身份写进歌词。"},{"start":486,"duration":15,"text":"就在所有人以为这只是一次临时表演时，舞台大屏幕突然播放庄正直的检举视频。视频里，他承认自己为了调进总公司，买通关系、调换劣质货物，并从中赚取差价。"},{"start":501,"duration":9,"text":"庄正直冲上台，试图阻止真相继续播放。可这一次，现场没有人再替他把问题说成“流程偏差”。"},{"start":510,"duration":16,"text":"马杰随后站到台上，承认自己多年没有涨薪、没有尊严，也承认自己曾经因为害怕背锅而选择沉默。潘怡然唱出外包员工的处境，胡建林则用最直接的方式，把所有黑话翻译成人话。"},{"start":526,"duration":13,"text":"他告诉全场，庄正直行贿买工作，结果阴差阳错把胡建林错调进来；很多人早就看出来了，却没人敢说，因为谁都不想成为下一个背锅的人。"},{"start":539,"duration":11,"text":"观众笑了出来，但笑声背后，是整个集团终于被迫承认：一路升职的不是一个天才，而是一场被所有人共同维护的误会。"},{"start":550,"duration":15,"text":"胡建林回忆起 1998 年的第一次年会。那时工厂也遇到过危机，有人建议让一半员工下岗，老厂长却说，年会不能停，人心不能散，不能放弃任何一个兄弟姐妹。"},{"start":565,"duration":7,"text":"多年以后，公司越来越大，年会也越来越奢华，却差点忘了最初为什么要聚在一起。"},{"start":572,"duration":15,"text":"董事长听完胡建林的发言，承诺彻查问题，并让那些本不该失去工作的员工回来。这个承诺没有把所有制度问题一笔勾销，却至少让被遮住的人重新被看见。"},{"start":587,"duration":11,"text":"事情过后，马杰升成高级经理；徐云峰、庄正直等违规人员被处理；胡建林回到标准件厂担任副厂长，新的数控车间正式投产。"},{"start":598,"duration":12,"text":"潘怡然虽然拿到了转正通知，却选择辞职去追求音乐。对她来说，留下不是唯一的成功，能够选择自己想过的生活，同样重要。"},{"start":610,"duration":13,"text":"三个人走出年会场馆时，还在争论刚才唱歌有没有跑调。马杰看着手机告诉他们，开除流程还没走完，三个人暂时都没有被开除，于是一起笑了起来。"},{"start":623,"duration":11,"text":"这就是《年会不能停！》最后留下的温度：它没有把胡建林变成拯救所有人的英雄，也没有承诺职场从此只剩公平。"},{"start":634,"duration":7,"text":"它只是让一个具体的人，在一群人都急着把事情说漂亮的时候，坚持把事情说清楚。"},{"start":641,"duration":15,"text":"年会总会结束，灯光总会熄灭，大家第二天还要回到各自的工位。但只要人还能辨认事实、辨认他人，也辨认自己不愿意变成什么样的人，这场年会就没有白开。"}];
